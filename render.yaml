services:
  - type: web
    name: operational-portal-backend
    env: node
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @op/shared run build && pnpm --filter @op/backend run build
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
